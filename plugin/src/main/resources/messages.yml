# uWorldGuard messages. MiniMessage format (https://docs.advntr.dev/minimessage/).
# PlaceholderAPI %placeholders% work when it is installed, resolved per player each time a message
# is sent, so keep them out of messages you do not need them in.
# Set any entry to "" or false to turn it off.
#
# no-permission is shown whenever a flag blocks a player. Override it for one flag with
# no-permission-<flag>, e.g. no-permission-chest-access. Flags that can send it:
#   block-break, block-place, break-placed-only, interact, chest-access, end-crystal-place, end-crystal-interact,
#   villager-trade, permit-workbenches, inventory-craft, disable-completely, disable-throw,
#   deny-item-drops, blocked-cmds

# Seconds before the same message can be shown to a player again, tracked per flag. 0 = no limit.
# Higher cuts chat spam from players spamming a denied action.
cooldown-seconds: 3

messages:
    no-permission: "<red>You don't have permission to do that here."
    # no-permission-chest-access: "<red>This container is locked."
    # no-permission-block-break: false
    entry-denied: "<red>You cannot enter this area."
    exit-denied: "<red>You cannot leave this area."
    # player-count-limit refused entry. <count> is how many are inside, <limit> the cap.
    region-full: "<red>This area is full (<count>/<limit>)."
    # Sent to staff with uworldguard.notify for regions using notify-enter / notify-leave.
    notify-enter: "<gray>[<aqua>uWG</aqua>] <white><player></white> entered <aqua><region>"
    notify-leave: "<gray>[<aqua>uWG</aqua>] <white><player></white> left <aqua><region>"
